version: '3.8'

services:
  aris-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: go-aris:latest
    container_name: aris-node-1
    ports:
      - "8089:8089"
    environment:
      - POD_NAME=aris-node-1
      - POD_IP=aris-1
      - USE_GNET=true
      - PORT=:8089
      - CLUSTER_ENABLED=true
      - NODE_ID=1
    volumes:
      - aris-data-1:/data
      - ./config:/config:ro
    networks:
      - aris-cluster
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8089"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  aris-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: go-aris:latest
    container_name: aris-node-2
    ports:
      - "8090:8089"
    environment:
      - POD_NAME=aris-node-2
      - POD_IP=aris-2
      - USE_GNET=true
      - PORT=:8089
      - CLUSTER_ENABLED=true
      - NODE_ID=2
    volumes:
      - aris-data-2:/data
      - ./config:/config:ro
    networks:
      - aris-cluster
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8089"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      - aris-1

  aris-3:
    build:
      context: .
      dockerfile: Dockerfile
    image: go-aris:latest
    container_name: aris-node-3
    ports:
      - "8091:8089"
    environment:
      - POD_NAME=aris-node-3
      - POD_IP=aris-3
      - USE_GNET=true
      - PORT=:8089
      - CLUSTER_ENABLED=true
      - NODE_ID=3
    volumes:
      - aris-data-3:/data
      - ./config:/config:ro
    networks:
      - aris-cluster
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8089"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      - aris-1
      - aris-2

  # Load balancer using HAProxy
  haproxy:
    image: haproxy:2.8-alpine
    container_name: aris-haproxy
    ports:
      - "6379:6379"
      - "8080:8080"  # HAProxy stats
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - aris-cluster
    depends_on:
      - aris-1
      - aris-2
      - aris-3
    restart: unless-stopped

  # Redis CLI for testing
  redis-cli:
    image: redis:7-alpine
    container_name: aris-redis-cli
    networks:
      - aris-cluster
    command: ["sleep", "infinity"]
    depends_on:
      - haproxy

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: aris-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - aris-cluster
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: aris-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - aris-cluster
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  aris-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  aris-data-1:
    driver: local
  aris-data-2:
    driver: local
  aris-data-3:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
